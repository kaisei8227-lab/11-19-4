<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('予約者一覧')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<main class="container">
    <p><a th:href="@{/admin/events}">← イベント管理に戻る</a></p>
    <h1 th:text="${event.title} + ' の予約者'">予約者</h1>
    <p class="board-meta"
       th:text="'開催 ' + ${#temporals.format(event.startAt, 'yyyy年M月d日(E) HH:mm')}
                + '・' + ${event.location}
                + '・予約期限 ' + ${#temporals.format(event.deadline, 'M月d日 HH:mm')}
                + '・' + ${#lists.size(reservations)} + ' / ' + ${event.capacity} + '名'">日時</p>

    <p th:if="${#lists.isEmpty(reservations)}" class="empty">まだ予約はありません。</p>

    <div th:unless="${#lists.isEmpty(reservations)}" class="table-wrap card">
    <table class="table">
        <thead>
        <tr><th>No.</th><th>氏名</th><th>フリガナ</th><th>メール</th><th>電話番号</th><th>学校名</th><th>備考</th><th>予約日時</th></tr>
        </thead>
        <tbody>
        <tr th:each="r, st : ${reservations}">
            <td data-label="No." th:text="${st.count}">1</td>
            <td data-label="氏名" th:text="${r.fullName}">山田 太郎</td>
            <td data-label="フリガナ" th:text="${r.fullNameKana}">ヤマダ タロウ</td>
            <td data-label="メール" th:text="${r.member.email}">a@example.com</td>
            <td data-label="電話番号" th:text="${r.phone}">090-1234-5678</td>
            <td data-label="学校名" th:text="${r.school}">-</td>
            <td data-label="備考" th:text="${r.note}">-</td>
            <td data-label="予約日時" th:text="${#temporals.format(r.createdAt, 'M/d HH:mm')}">11/19 10:00</td>
        </tr>
        </tbody>
    </table>
    </div>
</main>
</body>
</html>

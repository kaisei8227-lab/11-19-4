spring.application.name=event-reserve

# Render は PORT という環境変数で番号を渡してくる。ローカルでは 8080
server.port=${PORT:8080}
server.servlet.session.timeout=30m

# ---------- データベース（ローカル）----------
# プロジェクト直下の data フォルダにファイルとして保存される（再起動しても会員情報が残る）
spring.datasource.url=jdbc:h2:file:./data/eventdb
spring.datasource.username=sa
spring.datasource.password=

# テーブルはエンティティから自動で作る／更新する
spring.jpa.hibernate.ddl-auto=update
# 画面の表示中もDBから関連データを読めるようにする（学習用の簡単な設定）
spring.jpa.open-in-view=true

# テンプレートを変更したらすぐ反映
spring.thymeleaf.cache=false
